<!DOCTYPE html><html lang="es"><head><title>Buscar tutor · Tutor USMP</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="ESTILOS/tema.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={prefix:'tw-',corePlugins:{preflight:false}}</script></head><body data-page="buscar"><div id="nav"></div><main id="contenido" tabindex="-1">
<div class="container py-5"><h2 class="titulo mb-4">Buscar tutor</h2>
<ul class="nav nav-tabs mb-4" role="tablist"><li class="nav-item" role="presentation"><button type="button" role="tab" aria-selected="true" aria-controls="p1" class="nav-link active" id="t1" data-bs-toggle="tab" data-bs-target="#p1"><i class="bi bi-search"></i> Buscar por curso</button></li><li class="nav-item" role="presentation"><button type="button" role="tab" aria-selected="false" aria-controls="p2" class="nav-link" id="t2" data-bs-toggle="tab" data-bs-target="#p2"><i class="bi bi-journal-text"></i> Malla curricular</button></li></ul>
<div class="tab-content"><div class="tab-pane fade show active" id="p1" role="tabpanel" aria-labelledby="t1"><div class="row g-4">
<aside class="col-lg-3"><div class="tarjeta p-4"><h6 class="fw-bold text-guinda mb-3"><i class="bi bi-funnel"></i> Filtros</h6>
<label for="q" class="form-label small fw-semibold">Curso o tutor</label><input id="q" class="form-control mb-3" placeholder="Ej: Cálculo" autocomplete="off">
<label for="fCar" class="form-label small fw-semibold">Carrera</label><select id="fCar" class="form-select mb-3"><option value="">Todas</option></select>
<div class="row g-2 mb-3"><div class="col-5"><label for="fCic" class="form-label small fw-semibold">Ciclo</label><select id="fCic" class="form-select"><option value="0">Todos</option></select></div><div class="col-7"><label for="fTur" class="form-label small fw-semibold">Turno</label><select id="fTur" class="form-select"><option value="">Todos</option><option>Mañana</option><option>Tarde</option><option>Noche</option></select></div></div>
<label for="fDia" class="form-label small fw-semibold">Día</label><select id="fDia" class="form-select mb-3"><option value="">Todos</option></select>
<label for="fMod" class="form-label small fw-semibold">Modalidad</label><select id="fMod" class="form-select mb-3"><option value="">Todas</option><option>Presencial</option><option>Virtual</option></select>
<label for="fTip" class="form-label small fw-semibold">Tipo de tutor</label><select id="fTip" class="form-select mb-4"><option value="">Todos</option><option>Docente</option><option>Estudiante destacado</option></select>
<button id="limpiar" class="btn btn-outline-secondary w-100">Limpiar filtros</button></div></aside>
<section class="col-lg-9"><p class="text-muted" aria-live="polite"><b id="n">0</b> cursos encontrados <span class="small">· Tutores y horarios de ejemplo</span></p><div id="lista"></div>
<button id="mas" class="btn btn-outline-danger w-100 mb-3" style="display:none">Ver más cursos</button>
<div id="vacio" class="tarjeta p-5 text-center text-muted" style="display:none"><i class="bi bi-emoji-frown fs-1"></i><p class="mb-0 mt-2">No encontramos cursos con esos filtros.</p></div></section></div></div>
<div class="tab-pane fade" id="p2" role="tabpanel" aria-labelledby="t2"><div class="tarjeta p-4"><div class="row g-3 align-items-end mb-3"><div class="col-md-6"><label class="form-label fw-semibold">Carrera</label><select id="mCar" class="form-select"></select></div><div class="col-md-6 small text-muted">Toca un curso para ver sus tutores y horarios. El ciclo resaltado es el tuyo.</div></div><div class="accordion" id="acc"></div></div></div></div></div>
</main><div id="pie"></div><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="JS/datos.js"></script>
<script src="JS/app.js"></script>
<script>$(function(){const u=yo(),mia=u&&CARRERAS[u.carrera]?u.carrera:'',cicU=u?Math.max(0,ROM.indexOf(u.ciclo))+1:0;
NC.forEach(c=>{$('#fCar,#mCar').append($('<option>').text(c))});ROM.forEach((r,i)=>$('#fCic').append($('<option>').val(i+1).text(r)));DS.forEach(d=>$('#fDia').append($('<option>').text(d)));
const P=new URLSearchParams(location.search);
$('#q').val(P.get('q')||'');$('#fCar').val(P.has('carrera')?P.get('carrera'):mia);$('#fCic').val(P.get('ciclo')||0);$('#mCar').val(mia||NC[0]);
const turnoOk=(b,t)=>t=='Mañana'?b[0]<12:t=='Tarde'?(b[0]<18&&b[1]>12):b[1]>18;
let RES=[],LIM=10;
function buscar(){const f={car:$('#fCar').val(),cic:+$('#fCic').val(),q:nz($('#q').val().trim()),t:$('#fTur').val(),d:$('#fDia').val(),m:$('#fMod').val(),tp:$('#fTip').val()};
 const ok=t=>(!f.m||t.m.includes(f.m))&&(!f.tp||t.tipo==f.tp)&&Object.entries(t.hor).some(([d,b])=>(!f.d||d==f.d)&&(!f.t||turnoOk(b,f.t)));
 RES=CURSOS.filter(c=>(!f.car||c.car==f.car)&&(!f.cic||c.cic==f.cic)).map(c=>({c,ts:c.t.map(i=>TUTORES[i]).filter(ok)})).filter(x=>x.ts.length&&(!f.q||nz(x.c.n).includes(f.q)||x.ts.some(t=>nz(t.n).includes(f.q))));
 LIM=10;pintar()}
function pintar(){$('#lista').html(RES.slice(0,LIM).map(x=>`<div class="tarjeta curso-card p-4 mb-3"><div class="d-flex flex-wrap justify-content-between align-items-start gap-2"><div><h5 class="fw-bold mb-1">${x.c.n}</h5><span class="badge text-bg-light border">${x.c.car}</span> <span class="badge bg-guinda">${cicTxt(x.c.cic)}</span></div><span class="badge text-bg-success"><i class="bi bi-gift"></i> 100% gratuita</span></div>${x.ts.map(t=>filaTutor(t,x.c)).join('')}</div>`).join(''));
 $('#n').text(RES.length);$('#vacio').toggle(!RES.length);$('#mas').toggle(RES.length>LIM)}
$('#mas').click(()=>{LIM+=10;pintar()});
$('aside').on('input change','input,select',buscar);
autoCursos('#q',c=>{$('#q').val(c.n);$('#fCar').val(c.car);$('#fCic').val(c.cic);buscar()});
$('#limpiar').click(()=>{$('aside input').val('');$('#fCar,#fTur,#fDia,#fMod,#fTip').val('');$('#fCic').val(0);buscar()});
function malla(){const car=$('#mCar').val();$('#acc').html(CARRERAS[car].m.map((s,k)=>{const L=CURSOS.filter(c=>c.car==car&&c.cic==k+1),mio=car==mia&&k+1==cicU;
 return `<div class="accordion-item"><h2 class="accordion-header"><button class="accordion-button ${mio||(!cicU&&!k)?'':'collapsed'}" data-bs-toggle="collapse" data-bs-target="#c${k}">Ciclo ${ROM[k]} <span class="badge text-bg-light border ms-2">${L.length} cursos</span>${mio?'<span class="badge bg-guinda ms-2">Tu ciclo</span>':''}</button></h2>
 <div id="c${k}" class="accordion-collapse collapse ${mio||(!cicU&&!k)?'show':''}"><div class="accordion-body d-flex flex-wrap gap-2">${L.map(c=>`<button class="btn btn-outline-danger btn-sm curso-chip ${mio?'mio':''}" data-id="${c.id}">${c.n}</button>`).join('')}</div></div></div>`}).join('')+(()=>{const L=CURSOS.filter(c=>c.car==car&&c.cic==11);return L.length?`<div class="accordion-item"><h2 class="accordion-header"><button class="accordion-button collapsed" data-bs-toggle="collapse" data-bs-target="#c10">Electivos y certificaciones <span class="badge text-bg-light border ms-2">${L.length} cursos</span></button></h2><div id="c10" class="accordion-collapse collapse"><div class="accordion-body d-flex flex-wrap gap-2">${L.map(c=>`<button class="btn btn-outline-danger btn-sm curso-chip" data-id="${c.id}">${c.n}</button>`).join('')}</div></div></div>`:''})())}
$('#mCar').change(malla);malla();
$('#acc').on('click','.curso-chip',function(){const c=CURSOS[+$(this).data('id')];$('#q').val(c.n);$('#fCar').val(c.car);$('#fCic').val(c.cic);$('#fTur,#fDia,#fMod,#fTip').val('');buscar();bootstrap.Tab.getOrCreateInstance('#t1').show();window.scrollTo({top:0,behavior:'smooth'})});
buscar()});</script></body></html>
