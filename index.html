<!DOCTYPE html><html lang="es"><head><title>Iniciar sesión · Tutor USMP</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="ESTILOS/tema.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={prefix:'tw-',corePlugins:{preflight:false}}</script></head>
<body data-page="login"><div class="container-fluid"><div class="row min-vh-100">
<div class="col-lg-6 auth-lado d-none d-lg-flex flex-column justify-content-center align-items-center text-center p-5">
<img src="ESTILOS/logotutorusmp.jpg.png" alt="Logo Tutor USMP" class="mb-4"><h2 class="fw-bold">Tutor USMP</h2>
<p class="lead mb-0">Facultad de Ingeniería y Arquitectura</p><p class="opacity-75">Tutorías 100% gratuitas con tutores de tu propia facultad.</p></div>
<div class="col-lg-6 d-flex align-items-center justify-content-center p-4"><div style="max-width:400px;width:100%">
<h2 class="fw-bold text-guinda">Bienvenido</h2><p class="text-muted mb-4">Ingresa tus datos para acceder a la plataforma</p>
<form id="login" class="needs-validation" novalidate>
<div class="mb-3"><label for="usuario" class="form-label fw-semibold">Correo institucional</label><input type="email" id="usuario" autocomplete="username" name="usuario" class="form-control form-control-lg" placeholder="ejemplo@usmp.pe" required><div class="invalid-feedback">Ingresa un correo válido.</div></div>
<div class="mb-4"><label for="pass" class="form-label fw-semibold">Contraseña</label><div class="input-group"><input type="password" id="pass" autocomplete="current-password" name="password" class="form-control form-control-lg" placeholder="••••••••" required><button type="button" class="btn btn-outline-secondary" id="ver" aria-label="Mostrar contraseña" aria-pressed="false"><i class="bi bi-eye" aria-hidden="true"></i></button></div><div class="text-end mt-2"><a href="recuperar.html" class="small text-guinda fw-semibold text-decoration-none">¿Olvidaste tu contraseña?</a></div></div>
<div id="err" class="text-danger small mb-3" role="alert"></div><button class="btn btn-guinda btn-lg w-100">Ingresar</button></form>
<p class="text-center mt-4 text-muted">¿No tienes cuenta? <a href="registro.html" class="text-guinda fw-bold text-decoration-none">Regístrate</a></p></div></div></div></div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="JS/app.js"></script>
<script>$(function(){if(new URLSearchParams(location.search).has('exp'))$('#err').text('Tu sesión expiró por inactividad. Inicia sesión de nuevo.');
$('#ver').click(function(){const i=$('#pass'),s=i.attr('type')=='password';i.attr('type',s?'text':'password');$(this).find('i').toggleClass('bi-eye bi-eye-slash');$(this).attr({'aria-pressed':s,'aria-label':s?'Ocultar contraseña':'Mostrar contraseña'})});
$('#login').on('submit',function(e){e.preventDefault();$(this).addClass('was-validated');if(!this.checkValidity())return;
const c=$('[name=usuario]').val().trim().toLowerCase(),I=JSON.parse(localStorage.getItem('intentos')||'{}'),q=I[c]||{n:0,h:0};
if(q.h>Date.now())return $('#err').text('Demasiados intentos. Espera '+Math.ceil((q.h-Date.now())/1000)+' s e inténtalo de nuevo.');
const u=usuarios().find(y=>y.correo==c),p=$('#pass').val();
if(!u||!okPw(u,p)){q.n++;if(q.n>=5){q.h=Date.now()+60000;q.n=0}I[c]=q;localStorage.setItem('intentos',JSON.stringify(I));return $('#err').html('Correo o contraseña incorrectos. ¿No tienes cuenta? <a href="registro.html" class="text-guinda fw-bold">Regístrate</a>')}
if(!u.s){setPw(u,p);localStorage.setItem('usuarios',JSON.stringify(usuarios().map(y=>y.correo==c?u:y)))}
delete I[c];localStorage.setItem('intentos',JSON.stringify(I));localStorage.setItem('sesion',c);localStorage.setItem('ultima',Date.now());location.href=inicioDe(u)});});</script></body></html>
