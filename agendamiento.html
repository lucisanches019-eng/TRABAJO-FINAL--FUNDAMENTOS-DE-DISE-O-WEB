<!DOCTYPE html><html lang="es"><head><title>Agendamiento · Tutor USMP</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="ESTILOS/tema.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={prefix:'tw-',corePlugins:{preflight:false}}</script></head><body data-page="buscar"><div id="nav"></div><main id="contenido" tabindex="-1">
<div class="container py-5"><a id="volver" class="text-guinda text-decoration-none"><i class="bi bi-arrow-left"></i> Volver al perfil</a>
<h2 class="titulo my-4">Agendamiento</h2>
<div class="tarjeta p-4 mb-4"><div class="row align-items-center g-4"><div class="col-auto"><div class="avatar" id="ta" style="width:88px;height:88px;font-size:1.8rem"></div></div>
<div class="col-md"><div class="text-muted small">AGENDAR CON</div><h4 class="fw-bold mb-1" id="tn"></h4><div class="small d-flex flex-wrap gap-3"><span><b>Exp:</b> <span id="te"></span></span><span><b>Disp:</b> <span id="td"></span></span><span><b>Modalidad:</b> <span id="tm"></span></span><span><b>Punto de encuentro:</b> <i class="bi bi-geo-alt" aria-hidden="true"></i> <span id="tl"></span></span></div></div>
<div class="col-md-4"><label for="cs" class="form-label small fw-semibold">Curso a reforzar</label><select id="cs" class="form-select"></select><div class="small text-muted mt-1" id="cinfo"></div></div></div></div>
<div class="row g-4"><div class="col-lg-6"><div class="tarjeta p-4"><h6 class="fw-bold text-guinda mb-3">1.- ELIGE UNA FECHA</h6><div id="cal"></div><p class="small text-muted mt-3 mb-0"><span class="chip-disp">Días resaltados</span> = el tutor atiende (próximos 2 meses).</p></div></div>
<div class="col-lg-6"><div class="tarjeta p-4"><h6 class="fw-bold text-guinda mb-3">2.- HORARIOS DISPONIBLES <span id="fh" class="text-muted fw-normal small"></span></h6>
<div id="slots" class="d-flex flex-wrap gap-2 mb-3" role="group" aria-label="Horarios disponibles"><span class="text-muted small">Selecciona una fecha en el calendario.</span></div>
<div class="row g-2 mb-3"><div class="col-sm-6"><div class="caja-os small" id="mi">Mi disponibilidad:<br>Elige una fecha.</div></div><div class="col-sm-6"><div class="caja-gris small" id="chk" aria-live="polite">Elige un horario.</div></div></div>
<div id="modW" class="mb-3 d-none"><label class="form-label small fw-semibold d-block">Modalidad</label><div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="mod" id="m1" value="Presencial" checked><label class="form-check-label" for="m1">Presencial</label></div><div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="mod" id="m2" value="Virtual"><label class="form-check-label" for="m2">Virtual</label></div></div>
<div class="caja-res small mb-3" aria-live="polite"><b>Resumen:</b> <span id="res">—</span></div>
<button id="conf" class="btn btn-guinda btn-lg w-100" disabled>Confirmar reserva</button></div></div></div></div>
<div id="ok" style="display:none" title="¡Reserva confirmada!"></div>
</main><div id="pie"></div><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="JS/datos.js"></script>
<script src="JS/app.js"></script>
<script>$(function(){const u=yo(),P=new URLSearchParams(location.search),T=TUTORES[+P.get('t')||0];let C=CURSOS[+P.get('c')];if(!C||!C.t.includes(T.id))C=CURSOS[T.cur[0]];
const CL=clases(u);let F=null,H=null;const dn=d=>DS[(d.getDay()+6)%7];
$('#volver').attr('href','profesores.html?t='+T.id);$('#ta').text(ini(T));$('#tn').text(T.n);$('#te').text(expTxt(T));$('#td').text(dispTxt(T));$('#tm').text(T.m);$('#tl').text(ubicTxt(T));
const info=()=>$('#cinfo').text(C.car+' · '+cicTxt(C.cic));
$('#cs').html(T.cur.map(i=>`<option value="${i}">${CURSOS[i].n} (${cicTxt(CURSOS[i].cic)})</option>`).join('')).val(C.id).on('change',function(){C=CURSOS[+this.value];info();resumen()});info();
if(T.m.includes('/'))$('#modW').removeClass('d-none');
$('#cal').datepicker({minDate:1,maxDate:'+2m',firstDay:1,dateFormat:'yy-mm-dd',showOtherMonths:true,dayNamesMin:['Do','Lu','Ma','Mi','Ju','Vi','Sá'],monthNames:['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'],
 beforeShowDay:d=>T.hor[dn(d)]?[true,'dia-disp']:[false,''],onSelect:s=>{F=s;H=null;slots()}});
function slots(){const d=new Date(F+'T00:00:00'),b=T.hor[dn(d)],cl=CL[dn(d)],R=reservas(u);let h='';
 for(let x=b[0];x<b[1];x++){const why=ocupado(T,F,x)?'Ocupado':R.some(r=>r.f==F&&r.h==x)?'Ya tienes otra tutoría':(cl&&x<cl[1]&&x+1>cl[0])?'Cruce con tus clases':'';
  h+=`<button type="button" class="btn btn-outline-secondary slot" aria-pressed="false" data-h="${x}" ${why?'disabled':''}>${hora12(x)}${why?'<br><small>'+why+'</small>':''}</button>`}
 $('#fh').text('· '+fechaTxt(F));$('#slots').html(h);
 const libres=cl?[cl[0]>8?rango([8,cl[0]]):'',cl[1]<21?rango([cl[1],21]):''].filter(Boolean).join(' y '):rango([8,21]);
 $('#mi').html('Mi disponibilidad:<br>'+(cl?'✓ Tus clases: '+rango(cl)+'<br>✓ Tus horas libres: '+libres:'✓ Sin clases este día<br>✓ Libre: '+libres));
 estado()}
function estado(){if(H==null){$('#chk').attr('class','caja-gris small').html('Elige un horario.')}else $('#chk').attr('class','caja-ok small').html('✓ '+hora12(H)+' – '+hora12(H+1)+'<br>✓ Sin cruce con tus clases');resumen()}
function resumen(){const ok=F&&H!=null;$('#res').html(ok?fechaTxt(F)+' · '+hora12(H)+' – '+hora12(H+1)+' · <b>'+C.n+'</b> | Gratuito<br><i class="bi bi-geo-alt" aria-hidden="true"></i> '+esc(ubicTxt(T)):'—');$('#conf').prop('disabled',!ok)}
$('#slots').on('click','.slot:not(:disabled)',function(){H=+$(this).data('h');$('.slot').removeClass('sel').attr('aria-pressed','false');$(this).addClass('sel').attr('aria-pressed','true');estado()});
$('#conf').click(function(){const R=reservas(u),ah=new Date();if(R.some(r=>r.f==F&&r.h==H))return toast('Ya tienes una tutoría en ese horario.','warning');
if(R.filter(r=>new Date(r.f+'T'+String(r.h).padStart(2,'0')+':00:00')>=ah).length>=3)return toast('Ya tienes 3 tutorías pendientes. Cancela una o espera a completarla para reservar otra.','warning');
 R.push({id:Date.now(),t:T.id,c:C.id,f:F,h:H,mod:$('input[name=mod]:checked').val()||T.m});guardarReservas(u,R);
 $('#ok').html(`<p class="mb-2">Tutoría de <b>${C.n}</b> con <b>${T.n}</b><br>${fechaTxt(F)} · ${hora12(H)}<br><i class="bi bi-geo-alt" aria-hidden="true"></i> ${esc(ubicTxt(T))}</p><p class="text-success fw-semibold mb-0"><i class="bi bi-gift"></i> 100% gratuita</p>`).dialog({modal:true,width:380,close:()=>location.href='panelestudiantil.html',buttons:{'Ir a mis tutorías':function(){location.href='panelestudiantil.html'}}})})});</script></body></html>
