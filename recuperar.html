<!DOCTYPE html><html lang="es"><head><title>Recuperar contraseña · Tutor USMP</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="ESTILOS/tema.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={prefix:'tw-',corePlugins:{preflight:false}}</script></head><body data-page="recuperar"><div class="container-fluid"><div class="row min-vh-100">
<div class="col-lg-6 auth-lado d-none d-lg-flex flex-column justify-content-center align-items-center text-center p-5"><img src="ESTILOS/logotutorusmp.jpg.png" alt="Logo Tutor USMP" class="mb-4"><h2 class="fw-bold">Recupera tu acceso</h2><p class="opacity-75">Confirma tus datos y crea una nueva contraseña.</p></div>
<div class="col-lg-6 d-flex align-items-center justify-content-center p-4"><div style="max-width:400px;width:100%">
<h2 class="fw-bold text-guinda">¿Olvidaste tu contraseña?</h2><p class="text-muted mb-4">Ingresa el correo y el DNI con los que te registraste.</p>
<form id="rec" class="needs-validation" novalidate>
<div class="mb-3"><label for="c" class="form-label fw-semibold">Correo institucional</label><input type="email" id="c" class="form-control form-control-lg" placeholder="ejemplo@usmp.pe" required></div>
<div class="mb-3"><label for="d" class="form-label fw-semibold">DNI</label><input id="d" class="form-control form-control-lg" pattern="[0-9]{8}" maxlength="8" placeholder="8 dígitos" required><div class="invalid-feedback">Ingresa los 8 dígitos.</div></div>
<div class="mb-3"><label for="n" class="form-label fw-semibold">Nueva contraseña</label><input type="password" id="n" class="form-control form-control-lg" minlength="8" autocomplete="new-password" placeholder="Mínimo 8, con letras y números" required><div id="fz"></div></div>
<div class="mb-3"><label for="n2" class="form-label fw-semibold">Confirmar contraseña</label><input type="password" id="n2" class="form-control form-control-lg" required></div>
<div id="msg" class="mb-3 fw-semibold" role="status" aria-live="polite"></div><button class="btn btn-guinda btn-lg w-100">Cambiar contraseña</button></form>
<p class="text-center mt-4"><a href="index.html" class="text-guinda fw-bold text-decoration-none"><i class="bi bi-arrow-left"></i> Volver a iniciar sesión</a></p></div></div></div></div><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="JS/app.js"></script>
<script>$(function(){medidor('#n','#fz');const M=(t,c)=>$('#msg').attr('class','mb-3 fw-semibold text-'+c).text(t);
$('#rec').on('submit',function(e){e.preventDefault();$(this).addClass('was-validated');if(!this.checkValidity())return;
const c=$('#c').val().trim().toLowerCase(),d=$('#d').val().trim(),n=$('#n').val();
if(n!=$('#n2').val())return M('Las contraseñas no coinciden.','danger');
if(!pwOk(n))return M('La contraseña debe tener mínimo 8 caracteres con letras y números.','danger');
const I=JSON.parse(localStorage.getItem('intentos')||'{}'),k='rec:'+c,q=I[k]||{n:0,h:0};
if(q.h>Date.now())return M('Demasiados intentos. Espera '+Math.ceil((q.h-Date.now())/1000)+' s.','danger');
const u=usuarios().find(x=>x.correo==c&&x.dni==d);
if(!u){q.n++;if(q.n>=5){q.h=Date.now()+300000;q.n=0}I[k]=q;localStorage.setItem('intentos',JSON.stringify(I));return M('El correo y el DNI no coinciden con ninguna cuenta.','danger')}
setPw(u,n);localStorage.setItem('usuarios',JSON.stringify(usuarios().map(x=>x.correo==c?u:x)));
M('¡Contraseña actualizada! Te llevamos al inicio de sesión…','success');setTimeout(()=>location.href='index.html',1600)});});</script></body></html>
