<!DOCTYPE html><html lang="es"><head><title>Registro · Tutor USMP</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="ESTILOS/tema.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={prefix:'tw-',corePlugins:{preflight:false}}</script></head>
<body data-page="registro"><div class="container-fluid"><div class="row min-vh-100">
<div class="col-lg-5 auth-lado d-none d-lg-flex flex-column justify-content-center align-items-center text-center p-5">
<img src="ESTILOS/logotutorusmp.jpg.png" alt="Logo" class="mb-4"><h2 class="fw-bold">Sé parte de Tutor USMP</h2><p class="opacity-75">Reserva tutorías 100% gratuitas con docentes y estudiantes destacados de la FIA.</p></div>
<div class="col-lg-7 d-flex align-items-center justify-content-center p-4"><div style="max-width:520px;width:100%">
<h2 class="fw-bold text-guinda">Crear cuenta</h2><p class="text-muted mb-4">Completa tus datos para registrarte</p>
<form id="reg" class="row g-3 needs-validation" novalidate>
<fieldset class="col-12"><legend class="form-label fw-semibold fs-6">¿Cómo usarás Tutor USMP?</legend>
<div class="tw-grid tw-grid-cols-1 sm:tw-grid-cols-2 tw-gap-3">
<label class="rol-card"><input class="visually-hidden" type="radio" name="Rol" value="estudiante" checked><span class="rol-ic"><i class="bi bi-mortarboard" aria-hidden="true"></i></span><span><b class="d-block">Estudiante</b><small class="text-muted">Busco tutorías gratuitas</small></span></label>
<label class="rol-card"><input class="visually-hidden" type="radio" name="Rol" value="tutor"><span class="rol-ic"><i class="bi bi-person-workspace" aria-hidden="true"></i></span><span><b class="d-block">Profesor / Tutor</b><small class="text-muted">Quiero ofrecer tutorías</small></span></label>
</div></fieldset>
<div class="col-md-6"><input name="Nombres" class="form-control" placeholder="Nombres" aria-label="Nombres" autocomplete="given-name" pattern="[A-Za-zÁÉÍÓÚáéíóúÑñÜü ]{2,40}" maxlength="40" required><div class="invalid-feedback">Solo letras.</div></div>
<div class="col-md-6"><input name="Apellidos" class="form-control" placeholder="Apellidos" aria-label="Apellidos" autocomplete="family-name" pattern="[A-Za-zÁÉÍÓÚáéíóúÑñÜü ]{2,40}" maxlength="40" required><div class="invalid-feedback">Solo letras.</div></div>
<div class="col-12"><input type="email" name="Correo" class="form-control" placeholder="Correo institucional" aria-label="Correo institucional" autocomplete="email" required></div>
<div class="col-12"><input type="password" id="pw" class="form-control" placeholder="Crea una contraseña (mín. 8, con letras y números)" aria-label="Contraseña" minlength="8" autocomplete="new-password" required><div id="fz"></div></div>
<div class="col-md-6"><input name="DNI" class="form-control" placeholder="DNI" aria-label="DNI" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" required><div class="invalid-feedback">8 dígitos.</div></div>
<div class="col-md-6"><input name="Telefono" class="form-control" placeholder="Teléfono" aria-label="Teléfono" inputmode="tel" pattern="[0-9]{9}" maxlength="9" required><div class="invalid-feedback">9 dígitos.</div></div>
<div class="col-12 d-none" id="tipoW"><label class="form-label fw-semibold" for="tipoT">Tipo de tutor</label><select id="tipoT" name="TipoTutor" class="form-select"><option value="Docente">Docente</option><option value="Estudiante destacado">Estudiante destacado</option></select></div>
<div class="col-md-8"><select name="Carrera" class="form-select" aria-label="Carrera" required><option value="">Carrera</option><option>Ing. de Computación y Sistemas</option><option>Ing. Industrial</option><option>Ing. Civil</option><option>Arquitectura</option><option>Ciencias Aeronáuticas</option><option>Ciberseguridad y Análisis Forense</option><option>Ciencias de Datos</option><option>Inteligencia Artificial y Robótica</option></select></div>
<div class="col-md-4" id="cicW"><select name="Ciclo" class="form-select" aria-label="Ciclo" required><option value="">Ciclo</option><option>I</option><option>II</option><option>III</option><option>IV</option><option>V</option><option>VI</option><option>VII</option><option>VIII</option><option>IX</option><option>X</option></select></div>
<div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" id="ter" required><label class="form-check-label text-guinda" for="ter">Acepto la política de privacidad y los términos de servicio.</label></div></div>
<div class="col-12"><button class="btn btn-guinda btn-lg w-100" id="env">Enviar</button><div id="msg" class="mt-3 text-center fw-semibold" role="status" aria-live="polite"></div></div></form>
<p class="text-center mt-3 text-muted">¿Ya tienes cuenta? <a href="index.html" class="text-guinda fw-bold text-decoration-none">Inicia sesión</a></p></div></div></div></div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="JS/app.js"></script>
<script>$(function(){medidor('#pw','#fz');
function sync(){const t=$('[name=Rol]:checked').val()=='tutor';$('#tipoW').toggleClass('d-none',!t);const c=!t||$('#tipoT').val()!='Docente';$('#cicW').toggleClass('d-none',!c);$('[name=Ciclo]').prop('required',c).prop('disabled',!c);$('#env').text(t?'Crear cuenta de tutor':'Enviar')}
$('[name=Rol],#tipoT').on('change',sync);sync();
const M=(t,c)=>$('#msg').attr('class','mt-3 text-center fw-semibold text-'+c).text(t);
$('#reg').on('submit',function(e){e.preventDefault();$(this).addClass('was-validated');if(!this.checkValidity())return;
const n=$('[name=Nombres]').val().trim(),a=$('[name=Apellidos]').val().trim(),c=$('[name=Correo]').val().trim().toLowerCase();
if(!nombreValido(n)||!nombreValido(a))return M('Ingresa tu nombre y apellidos reales (solo letras).','danger');
if(!pwOk($('#pw').val()))return M('La contraseña debe tener mínimo 8 caracteres con letras y números.','danger');
if(usuarios().some(u=>u.correo==c))return M('Ese correo ya está registrado. Inicia sesión.','danger');
$('#env').prop('disabled',true);
$.ajax({url:'https://formspree.io/f/xjykjgqy',method:'POST',data:$(this).serialize(),dataType:'json'})
.done(function(){const u={correo:c,nombres:cap(n),apellidos:cap(a),nombre:cap(n)+' '+cap(a),dni:$('[name=DNI]').val(),carrera:$('[name=Carrera]').val(),ciclo:$('[name=Ciclo]').val()||'',rol:$('[name=Rol]:checked').val(),tipoTutor:$('[name=Rol]:checked').val()=='tutor'?$('#tipoT').val():undefined};setPw(u,$('#pw').val());
localStorage.setItem('usuarios',JSON.stringify([...usuarios(),u]));localStorage.setItem('sesion',c);localStorage.setItem('ultima',Date.now());
M('¡Registro exitoso, '+u.nombres.split(' ')[0]+'! '+(u.rol=='tutor'?'Te llevamos a tu panel de tutor…':'Entrando…'),'success');toast('Cuenta creada como '+(u.rol=='tutor'?'profesor/tutor':'estudiante'),'success');setTimeout(()=>location.href=inicioDe(u),1500)})
.fail(function(){M('No se pudo enviar. Intenta de nuevo.','danger');$('#env').prop('disabled',false)});});});</script></body></html>
